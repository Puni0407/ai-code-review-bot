name: Code Review CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, test-ai-review]

permissions:
  contents: read
  pull-requests: write
  models: read

jobs:
  analyze:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # IMPORTANT for git diff merge-base

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Format Check (Prettier)
        run: npm run format:check

      - name: Lint (ESLint)
        run: npm run lint

      - name: Run Custom Analyzer
        run: npm run analyze

      # ✅ Generate PR Diff
      - name: Generate Diff
        if: github.event_name == 'pull_request'
        run: |
          git diff ${{ github.event.pull_request.base.sha }} ${{ github.event.pull_request.head.sha }} > diff.txt
          echo "Diff lines:"
          wc -l diff.txt

      # ✅ Run AI Review (GitHub Models)
      - name: Run AI Review (GitHub Models)
        if: github.event_name == 'pull_request'
        env:
          GH_MODELS_TOKEN: ${{ secrets.GH_MODELS_TOKEN }}
        run: |
          node src/scripts/ai_review.js diff.txt > review.md

      # ✅ Post Review Comment to PR
      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('review.md', 'utf8');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: "## 🤖 AI Code Review\n\n" + body
            });
